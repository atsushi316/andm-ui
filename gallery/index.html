<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>andm-ui Product Gallery — Button</title>
    <link rel="stylesheet" href="../dist/style.css" />
    <style>
      /* Gallery layout only — no component look overrides */
      .g {
        max-width: 960px;
        margin: 0 auto;
        padding: var(--andm-space-6) var(--andm-space-4) var(--andm-space-8);
      }
      .g h1 {
        font-size: 1.5rem;
        font-weight: 650;
        margin: 0 0 var(--andm-space-2);
      }
      .g p.lead {
        margin: 0 0 var(--andm-space-6);
        color: var(--andm-color-on-surface-variant);
      }
      .g h2 {
        font-size: 1rem;
        font-weight: 650;
        margin: var(--andm-space-6) 0 var(--andm-space-3);
      }
      .g-row {
        display: flex;
        flex-wrap: wrap;
        gap: var(--andm-space-3);
        align-items: center;
      }
      .g-grid {
        display: grid;
        gap: var(--andm-space-3);
      }
      .g-label {
        font-size: var(--andm-font-size-sm);
        color: var(--andm-color-on-surface-variant);
        min-width: 5.5rem;
      }
      .g-pair {
        display: flex;
        flex-wrap: wrap;
        gap: var(--andm-space-3);
        align-items: center;
      }
    </style>
  </head>
  <body>
    <main class="g">
      <h1>andm-ui — Button</h1>
      <p class="lead">
        製品 Gallery。必ず <code>dist/style.css</code> を参照しています。
      </p>

      <h2>Variants</h2>
      <div class="g-row">
        <button type="button" class="andm-btn andm-btn--elevated andm-btn--md">
          Elevated
        </button>
        <button type="button" class="andm-btn andm-btn--filled andm-btn--md">
          Filled
        </button>
        <button type="button" class="andm-btn andm-btn--tonal andm-btn--md">
          Tonal
        </button>
        <button type="button" class="andm-btn andm-btn--outlined andm-btn--md">
          Outlined
        </button>
        <button type="button" class="andm-btn andm-btn--text andm-btn--md">
          Text
        </button>
      </div>

      <h2>Sizes</h2>
      <div class="g-row">
        <button type="button" class="andm-btn andm-btn--filled andm-btn--sm">
          Small
        </button>
        <button type="button" class="andm-btn andm-btn--filled andm-btn--md">
          Medium
        </button>
        <button type="button" class="andm-btn andm-btn--filled andm-btn--lg">
          Large
        </button>
      </div>

      <h2>Icons（leading / trailing）</h2>
      <div class="g-row">
        <button type="button" class="andm-btn andm-btn--filled andm-btn--md">
          <svg class="andm-btn__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"
            />
          </svg>
          Leading
        </button>
        <button type="button" class="andm-btn andm-btn--outlined andm-btn--md">
          Trailing
          <svg class="andm-btn__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z" />
          </svg>
        </button>
        <button type="button" class="andm-btn andm-btn--tonal andm-btn--md">
          <svg class="andm-btn__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"
            />
          </svg>
          Save
        </button>
      </div>

      <h2>States</h2>
      <div class="g-grid">
        <div class="g-pair">
          <span class="g-label">default</span>
          <button type="button" class="andm-btn andm-btn--filled andm-btn--md">
            Default
          </button>
          <button type="button" class="andm-btn andm-btn--outlined andm-btn--md">
            Default
          </button>
        </div>
        <div class="g-pair">
          <span class="g-label">hover</span>
          <span style="color: var(--andm-color-on-surface-variant); font-size: var(--andm-font-size-sm)"
            >マウスオーバーで確認</span
          >
        </div>
        <div class="g-pair">
          <span class="g-label">active</span>
          <span style="color: var(--andm-color-on-surface-variant); font-size: var(--andm-font-size-sm)"
            >押下で確認</span
          >
        </div>
        <div class="g-pair">
          <span class="g-label">focus-visible</span>
          <button type="button" class="andm-btn andm-btn--filled andm-btn--md">
            Tab でフォーカス
          </button>
          <button type="button" class="andm-btn andm-btn--outlined andm-btn--md">
            Tab でフォーカス
          </button>
        </div>
        <div class="g-pair">
          <span class="g-label">disabled</span>
          <button
            type="button"
            class="andm-btn andm-btn--filled andm-btn--md"
            disabled
          >
            Disabled
          </button>
          <button
            type="button"
            class="andm-btn andm-btn--elevated andm-btn--md"
            disabled
          >
            Disabled
          </button>
          <button
            type="button"
            class="andm-btn andm-btn--tonal andm-btn--md"
            disabled
          >
            Disabled
          </button>
          <button
            type="button"
            class="andm-btn andm-btn--outlined andm-btn--md"
            disabled
          >
            Disabled
          </button>
          <button
            type="button"
            class="andm-btn andm-btn--text andm-btn--md"
            disabled
          >
            Disabled
          </button>
        </div>
      </div>

      <h2>Variant × Size</h2>
      <div class="g-grid">
        <div class="g-pair">
          <span class="g-label">elevated</span>
          <button type="button" class="andm-btn andm-btn--elevated andm-btn--sm">
            Sm
          </button>
          <button type="button" class="andm-btn andm-btn--elevated andm-btn--md">
            Md
          </button>
          <button type="button" class="andm-btn andm-btn--elevated andm-btn--lg">
            Lg
          </button>
        </div>
        <div class="g-pair">
          <span class="g-label">filled</span>
          <button type="button" class="andm-btn andm-btn--filled andm-btn--sm">
            Sm
          </button>
          <button type="button" class="andm-btn andm-btn--filled andm-btn--md">
            Md
          </button>
          <button type="button" class="andm-btn andm-btn--filled andm-btn--lg">
            Lg
          </button>
        </div>
        <div class="g-pair">
          <span class="g-label">tonal</span>
          <button type="button" class="andm-btn andm-btn--tonal andm-btn--sm">
            Sm
          </button>
          <button type="button" class="andm-btn andm-btn--tonal andm-btn--md">
            Md
          </button>
          <button type="button" class="andm-btn andm-btn--tonal andm-btn--lg">
            Lg
          </button>
        </div>
        <div class="g-pair">
          <span class="g-label">outlined</span>
          <button type="button" class="andm-btn andm-btn--outlined andm-btn--sm">
            Sm
          </button>
          <button type="button" class="andm-btn andm-btn--outlined andm-btn--md">
            Md
          </button>
          <button type="button" class="andm-btn andm-btn--outlined andm-btn--lg">
            Lg
          </button>
        </div>
        <div class="g-pair">
          <span class="g-label">text</span>
          <button type="button" class="andm-btn andm-btn--text andm-btn--sm">
            Sm
          </button>
          <button type="button" class="andm-btn andm-btn--text andm-btn--md">
            Md
          </button>
          <button type="button" class="andm-btn andm-btn--text andm-btn--lg">
            Lg
          </button>
        </div>
      </div>
    </main>
  </body>
</html>
