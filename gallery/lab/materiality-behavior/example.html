<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buttonの局所拡張を使う / andm-ui Lab</title><link rel="stylesheet" href="../../../dist/style.css"><link rel="stylesheet" href="button.css"><link rel="stylesheet" href="lab.css"></head><body class="mb-lab mb-scope"><header><a href="./">← 質感の比較へ</a><p class="eyebrow">REUSE EXAMPLE</p><h1>下書きを、保存する。</h1><p>既存ButtonのNative操作を使い、視覚面の復元だけを局所拡張した例です。実際の保存先はありません。</p></header><main><form id="draft-form" class="evaluation"><label class="form-row">メモ<textarea id="draft" required maxlength="1000" placeholder="長い日本語のメモも入力できます。"></textarea></label><div class="stage"><button type="submit" class="andm-btn andm-btn--filled mb-button" data-shape="round" data-return="elastic"><span class="mb-face" aria-hidden="true"></span><span class="mb-label">下書きを保存する</span></button></div><p id="example-result" role="status">まだ保存していません。</p><p>成功はformのsubmitで通知します。復元の終了は待ちません。空欄の場合はNativeの入力チェックで保存を止めます。</p><a href="../../../docs/MATERIALITY-BEHAVIOR.md">コードと操作契約を読む</a></form></main><script type="module">import {enhanceButton} from './button.js';enhanceButton(document.querySelector('.mb-button'));let n=0;document.querySelector('#draft-form').addEventListener('submit',e=>{e.preventDefault();document.querySelector('#example-result').textContent='下書きを保存しました（模擬） · '+(++n)+'回目';});</script></body></html>
