<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>余白とモーダル · andm-ui</title><link rel="stylesheet" href="../../dist/style.css"><style>
body{background:#f4f6f8;color:#172a34;font:16px/1.6 system-ui,sans-serif}header,main{max-width:960px;margin:auto;padding:24px}header h1{font-size:1.6rem;margin:12px 0}header p{margin:8px 0}header a{color:#1554b8}header label{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-top:20px}header select{font:inherit;padding:10px;max-width:100%}.review{font:var(--andm-type-body-weight) var(--andm-type-body-size)/var(--andm-type-body-line-height) var(--andm-type-body-font);color:var(--andm-color-on-surface)}.review-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--andm-space-section);align-items:start}.review .andm-card{display:flex;flex-direction:column;gap:var(--andm-space-group)}.review .andm-card__title{margin:0}.review .andm-card__actions{margin:0}.review .andm-stack{margin:0}.review legend{padding:0}.review fieldset{border:0;padding:0;margin:0;min-width:0}.review .andm-form-actions{margin:0}.review .andm-dialog__body p{margin:0}.review .andm-dialog__body p+p{margin-top:var(--andm-space-paragraph)}.metrics{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;font:14px/1.5 system-ui}.metrics span{padding:6px 10px;background:#fff;border:1px solid #d5dce7;border-radius:6px}@media(max-width:640px){header,main{padding:16px}.review-grid{grid-template-columns:minmax(0,1fr)}}
</style></head><body><header><a href="../">← 部品ギャラリー</a><h1>余白とモーダルを見比べる</h1><p>同じ内容をシリーズごとに切り替えて、要素のまとまり・内側余白・本文と操作の距離を確認できます。</p><label for="series">シリーズ<select id="series"><option value="">Baseline</option><option value="fluent">Fluent 2</option><option value="carbon">Carbon</option><option value="atlassian">Atlassian</option><option value="uswds">USWDS</option><option value="dads">DADS</option><option value="expressive">M3 Expressive</option><option value="spectrum">Spectrum</option><option value="apple">Apple</option><option value="soft">Soft</option><option value="dense">Dense</option><option value="technical">Technical</option><option value="editorial">Editorial</option><option value="playful">Playful</option></select></label><p id="basis">Baselineはandm独自の設計です。</p><div class="metrics" id="metrics" aria-live="polite"></div></header>
<main id="review" class="review"><div class="review-grid"><section class="andm-card"><h2 class="andm-card__title">プロフィール</h2><p class="andm-card__body">ラベルと入力を近づけ、別の入力項目や操作群との関係を分けます。</p><form class="andm-stack" onsubmit="return false"><div class="andm-textfield"><label for="name" class="andm-textfield__label">表示名</label><input id="name" class="andm-textfield__input" value="宮本" aria-describedby="name-help"><p id="name-help" class="andm-textfield__helper">共同作業の画面に表示される名前です。</p></div><div class="andm-textfield andm-textfield--textarea"><label for="description" class="andm-textfield__label">ひとこと</label><textarea id="description" class="andm-textfield__input" rows="3">散らばった考えを、自分の言葉でつなぐ。</textarea></div><fieldset class="andm-stack"><legend class="andm-label">通知</legend><label class="andm-checkbox"><input class="andm-checkbox__input" type="checkbox" checked><span>自分への返信を知らせる</span></label><label class="andm-checkbox"><input class="andm-checkbox__input" type="checkbox"><span>週ごとの活動を知らせる</span></label></fieldset><div class="andm-form-actions"><button class="andm-btn andm-btn--outlined" type="reset">元に戻す</button><button class="andm-btn andm-btn--filled" type="button" id="open">変更を確認</button></div></form></section>
<section class="andm-card"><h2 class="andm-card__title">モーダルの確認</h2><p class="andm-card__body">短い確認と長文の両方で、タイトル・本文・アクションの配置を確認します。</p><div class="andm-card__actions"><button type="button" class="andm-btn andm-btn--outlined" id="open-short">短い確認を開く</button><button type="button" class="andm-btn andm-btn--outlined" id="open-long">長文を開く</button></div><p class="andm-card__body">入力内容はシリーズ切り替え後も保持されます。</p></section></div>
<dialog class="andm-dialog" id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-description"><div class="andm-dialog__panel"><h2 class="andm-dialog__title" id="confirm-title">この内容でプロフィールを更新しますか</h2><div class="andm-dialog__body"><p id="confirm-description">表示名とひとことが共同作業の画面に反映されます。</p></div><div class="andm-dialog__actions"><button type="button" class="andm-btn andm-btn--text" data-close>キャンセル</button><button type="button" class="andm-btn andm-btn--filled" data-close>更新する</button></div></div></dialog>
<dialog class="andm-dialog" id="long" aria-labelledby="long-title"><div class="andm-dialog__panel"><h2 class="andm-dialog__title" id="long-title" tabindex="-1">長い日本語の説明を確認する</h2><div class="andm-dialog__body" id="long-body" tabindex="0"></div><div class="andm-dialog__actions"><button type="button" class="andm-btn andm-btn--outlined" data-close>閉じる</button></div></div></dialog>
</main><script type="module">
const select=document.querySelector('#series'),review=document.querySelector('#review'),basis=document.querySelector('#basis'),metrics=document.querySelector('#metrics');
const notes={fluent:'Fluent公式実装の内側24px・間隔8px・角8pxを採用。画面構成への割り当てはandmの解釈です。',carbon:'Carbonの段階的な余白・角のない面・横いっぱいのフッターを反映。共通Native APIへの適応版です。',dads:'DADS公式サンプルの内側余白・見出し・角・48remでの切り替えを反映。共通Native APIへの適応版です。',spectrum:'Spectrum CSS tokens 16.0.2の確認ダイアログ内側40px・角4px・見出し18pxを反映。本文と操作の区分は共通構造への写像です。',uswds:'USWDS公式コードの余白と左から並ぶ操作を共通構造へ写像しています。',atlassian:'Atlassian公式余白尺度・用途区分を採用。モーダル専用寸法は未確認で、24px内側余白はandmの判断です。',expressive:'Material Webの標準ダイアログ余白を共通構造へ写像。Expressive固有ダイアログの仕様とは区別します。',apple:'Apple HIGの本文を取得できず、公式の余白は未確認です。Baselineの余白を維持しています。'};
function update(){review.className='review'+(select.value?' andm-series--'+select.value:'');basis.textContent=notes[select.value]||'andm独自シリーズの設計です。外部公式の再現ではありません。';const style=getComputedStyle(review);metrics.replaceChildren();for(const [name,token] of [['関連要素','related'],['同じ群','group'],['セクション','section'],['内側','inset']]){const span=document.createElement('span');span.textContent=name+'：'+style.getPropertyValue('--andm-space-'+token).trim();metrics.append(span);}const url=new URL(location.href);url.searchParams.set('series',select.value);history.replaceState(null,'',url);}
const initial=new URL(location.href).searchParams.get('series');if([...select.options].some(o=>o.value===initial))select.value=initial;select.addEventListener('change',update);update();
for(let i=0;i<14;i++){const p=document.createElement('p');p.textContent=(i+1)+'．この説明は、本文が長い場合の読みやすさを確認するためのサンプルです。タイトルと閉じる操作を保ちながら、本文だけをスクロールして読み進められます。';document.querySelector('#long-body').append(p);}
for(const [id,target] of [['open','confirm'],['open-short','confirm'],['open-long','long']]){const trigger=document.getElementById(id),dialog=document.getElementById(target);trigger.addEventListener('click',()=>{dialog._trigger=trigger;dialog.showModal();if(target==='long')document.querySelector('#long-title').focus();});}
for(const dialog of document.querySelectorAll('dialog')){dialog.querySelectorAll('[data-close]').forEach(button=>button.addEventListener('click',()=>dialog.close()));dialog.addEventListener('close',()=>dialog._trigger?.focus());}
</script></body></html>
