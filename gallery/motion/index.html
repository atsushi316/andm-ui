<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>モーション — andm-ui Gallery</title>
    <link rel="stylesheet" href="../../dist/style.css" />
    <link rel="stylesheet" href="../catalog.css" />
  </head>
  <body>
    <div class="g-shell">
      <nav class="g-nav" aria-label="Gallery">
        <a class="g-nav__brand" href="../">andm-ui</a>
        <p class="g-nav__tag">Product Gallery</p>
        <ul>
          <li><a href="../">Gallery</a></li>
          <li><a href="../colors/">色</a></li>
          <li><a href="./" aria-current="page">モーション</a></li>
          <li><a href="../tokens/">トークン</a></li>
        </ul>
      </nav>
      <main class="g-main">
        <h1>モーション</h1>
        <p class="g-lead">
          シリーズを選ぶと、Button のホバーと押下をそのシリーズのまま試せます。動きの説明は Gallery と同じ文です。
        </p>
        <fieldset class="g-switch">
          <legend>シリーズ</legend>
          <div class="g-switch__list" id="series-switch"></div>
        </fieldset>
        <p class="g-status" id="status">読み込み中</p>
        <div class="g-stage" id="stage">
          <p class="g-motion" id="series-motion"></p>
          <div class="g-row">
            <button type="button" class="andm-btn andm-btn--filled andm-btn--sm">保存</button>
            <button type="button" class="andm-btn andm-btn--filled andm-btn--md">試してみる</button>
            <button type="button" class="andm-btn andm-btn--filled andm-btn--lg">強調</button>
          </div>
          <div class="g-row">
            <button type="button" class="andm-btn andm-btn--elevated andm-btn--md">浮かせ</button>
            <button type="button" class="andm-btn andm-btn--tonal andm-btn--md">薄い塗り</button>
            <button type="button" class="andm-btn andm-btn--outlined andm-btn--md">枠線</button>
            <button type="button" class="andm-btn andm-btn--text andm-btn--md">テキスト</button>
          </div>
        </div>
      </main>
    </div>
    <script src="../series-copy.js"></script>
    <script src="../catalog.js"></script>
    <script>
      (function () {
        var catalog = window.ANDM_CATALOG;
        var copy = window.ANDM_SERIES_COPY;
        var list = document.getElementById("series-switch");
        var stage = document.getElementById("stage");
        var motion = document.getElementById("series-motion");
        var status = document.getElementById("status");
        var items = [];
        var fallback =
          "このシリーズの動きの説明は、まだありません。下のボタンでホバーと押下を試せます。";

        function show(item) {
          catalog.applySeries(stage, item.className);
          var brief = copy.briefs[item.id];
          motion.textContent = brief && brief.motion ? brief.motion : fallback;
          status.textContent = "切替はシリーズの外です。ボタンだけが切り替わります。";
        }

        catalog
          .loadCss("../../dist/style.css")
          .then(function (css) {
            items = catalog.seriesItems(css);
            catalog.renderSwitch(list, items, function (item) {
              if (location.hash.replace("#", "") !== item.id) {
                history.replaceState(null, "", "#" + item.id);
              }
              show(item);
            });
            var id = location.hash.replace("#", "");
            var current = items.find(function (item) {
              return item.id === id;
            });
            if (!current) current = items[0];
            catalog.selectSeries(list, current.id);
            show(current);
          })
          .catch(function () {
            status.textContent =
              "dist/style.css を読めません。build したあと、再読み込みしてください。";
          });

        window.addEventListener("hashchange", function () {
          var id = location.hash.replace("#", "");
          var current = items.find(function (item) {
            return item.id === id;
          });
          if (!current) return;
          catalog.selectSeries(list, current.id);
          show(current);
        });
      })();
    </script>
  </body>
</html>
